name: Director plugin checks

# Linux and Windows jobs run on ephemeral 32-core runners (tfinfra
# roots/github-runners, docs/github-runners-plan.md). Other platforms, releases,
# and every pull request from a fork stay on GitHub's runners: a fork's code
# never runs on ours. Job names are unchanged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || fromJSON('["self-hosted","windows","ghr-windows-x64"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Fetch verified Rust runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./fetch-runtime.ps1
      - run: dotnet restore --locked-mode
      - name: Fetch pinned NINA native test dependency
        shell: pwsh
        run: ./tools/fetch-nina-test-dependencies.ps1
      - run: dotnet format --verify-no-changes --no-restore
      - name: Runtime fetch regression checks
        shell: pwsh
        run: ./tools/test-runtime-fetch.ps1
      - run: dotnet build --configuration Release --no-restore
      # At most 8 xUnit threads. On a 32-core runner xUnit otherwise runs ~32
      # tests at once, and SettingsViewTests (a WPF render with a 20 s budget)
      # timed out under that contention; alone it takes 2 s. 4 and 8 threads
      # both pass and finish the suite sooner (20 s against 24 s).
      - run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=director.trx" -- xUnit.MaxParallelThreads=8
      - name: Stress ledger and preparation recovery
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            dotnet test --configuration Release --no-build --filter "FullyQualifiedName~LedgerTests|FullyQualifiedName~PreparationTests|FullyQualifiedName~ProgramTests" --logger "trx;LogFileName=ledger-stress-$_.trx"
            if ($LASTEXITCODE -ne 0) { throw "Ledger restart stress failed on iteration $_." }
          }
      - name: Build development bundle
        shell: pwsh
        run: ./build-package.ps1
      - name: Build preview release metadata
        shell: pwsh
        run: |
          ./tools/test-preview-manifest.ps1
          ./build-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: director-development-bundle
          path: artifacts/PSFGuardDirector-0.1.0.0-dev.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: director-preview-release
          path: |
            artifacts/PSFGuardDirector-0.1.0.2.zip
            artifacts/PSFGuardDirector-0.1.0.2.manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: director-test-results
          path: |
            **/TestResults/*.trx
            artifacts/settings-*.png
